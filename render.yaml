services:
  # Web Service
  - type: web
    name: tlds-events-backend
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://events.thinklabdigitalsolutions.com
      - key: MONGO_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: COOKIE_SECURE
        value: true
    healthCheckPath: /
    autoDeploy: true
    # Custom domain configuration (optional - set in Render dashboard)
    # domains:
    #   - api.thinklabdigitalsolutions.com
    
  # MongoDB (using Render's managed MongoDB)
  - type: pserv
    name: tlds-events-db
    env: docker
    plan: free
    repo: https://github.com/render-examples/mongodb
    envVars:
      - key: MONGO_INITDB_ROOT_USERNAME
        value: admin
      - key: MONGO_INITDB_ROOT_PASSWORD
        generateValue: true
      - key: MONGO_INITDB_DATABASE
        value: tldsevents
