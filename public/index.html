<!DOCTYPE html>
<html>
<head>
<title>TLDS Events - Thinklab Digital Solutions LLP</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animations.css">

<style>

html{
  scroll-behavior:smooth;
}

:root{
  --bg:#131414;
  --card:#1C1C1E;
  --accent:#A280FF;
  --text:#fff;
  --muted:#aaa;
  --gradient:linear-gradient(135deg, #A280FF 0%, #7B68EE 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* SECTIONS */

section{
  padding:80px 30px;
  max-width:1400px;
  margin:auto;
}

/* HERO */

.hero{
  text-align:center;
  padding:0;
  max-width:100%;
  position:relative;
  overflow:hidden;
}

.hero img{
  width:100%;
  max-height:500px;
  object-fit:cover;
  border-radius:0;
  margin-bottom:0;
  mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0));
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0));
  filter:brightness(0.7) contrast(1.1);
  transform:scale(1.05);
  animation:heroImage 20s ease-in-out infinite alternate;
}

@keyframes heroImage{
  0%{
    transform:scale(1.05);
  }
  100%{
    transform:scale(1.1);
  }
}

.hero-content{
  margin-top:-120px;
  position:relative;
  z-index:10;
}

.hero h1{
  font-size:56px;
  margin-bottom:15px;
  background:var(--gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  font-weight:700;
  letter-spacing:-2px;
  text-shadow:0 0 40px rgba(162,128,255,0.3);
  animation:textGlow 3s ease-in-out infinite alternate;
}

@keyframes textGlow{
  0%{
    text-shadow:0 0 40px rgba(162,128,255,0.3);
  }
  100%{
    text-shadow:0 0 60px rgba(162,128,255,0.5), 0 0 100px rgba(162,128,255,0.3);
  }
}

.hero p{
  color:var(--muted);
  font-size:18px;
  font-weight:300;
  text-shadow:0 2px 10px rgba(0,0,0,0.5);
}

/* HERO BUTTON */

.hero a{
  display:inline-block;
  margin-top:20px;
  padding:12px 25px;
  background:var(--accent);
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-weight:600;
  transition:0.3s;
}

.hero a:hover{
  opacity:0.9;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  align-items:center;
}

.grid img{
  width:100%;
  border-radius:12px;
}

@media(max-width:768px){
  .grid{
    grid-template-columns:1fr;
  }
}

/* EVENTS GRID */

.events-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:30px;
  margin-top:40px;
}

.event-card{
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  transition:all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  cursor:pointer;
  border:1px solid rgba(255,255,255,0.05);
}

.event-card:hover{
  transform:translateY(-8px);
  box-shadow:0 20px 40px rgba(162,128,255,0.15);
  border-color:rgba(162,128,255,0.3);
}

.event-card img{
  width:100%;
  height:320px;
  object-fit:cover;
  transition:transform 0.4s;
}

.event-card:hover img{
  transform:scale(1.05);
}

.event-content{
  padding:24px;
}

.event-content h3{
  font-size:20px;
  margin-bottom:12px;
  color:var(--text);
  font-weight:600;
  line-height:1.3;
}

.event-content p{
  color:var(--muted);
  font-size:14px;
  margin-bottom:10px;
  line-height:1.5;
}

.event-date{
  color:var(--accent);
  font-weight:600;
  margin-bottom:15px;
  font-size:14px;
}

.event-cta{
  display:inline-block;
  padding:10px 24px;
  background:var(--gradient);
  color:white;
  text-decoration:none;
  border-radius:8px;
  font-size:14px;
  font-weight:600;
  transition:all 0.3s;
}

.event-cta:hover{
  transform:scale(1.05);
  box-shadow:0 4px 15px rgba(162,128,255,0.4);
}

.loading{
  text-align:center;
  padding:50px;
  color:var(--muted);
}

.no-events{
  text-align:center;
  padding:50px;
  color:var(--muted);
}

/* SECTION HEADING */

#events h2{
  font-size:36px;
  font-weight:700;
  margin-bottom:10px;
  background:var(--gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* MOBILE RESPONSIVE STYLES */

@media (max-width: 768px) {
  /* Hero Section */
  .hero {
    padding: 60px 20px;
    min-height: 60vh;
  }
  
  .hero img {
    height: 200px;
    object-fit: cover;
    border-radius: 12px;
  }
  
  .hero-content h1 {
    font-size: 32px;
    margin-bottom: 15px;
  }
  
  .hero-content p {
    font-size: 16px;
    margin-bottom: 8px;
  }
  
  /* Events Section */
  section {
    padding: 60px 20px;
  }
  
  #events h2 {
    font-size: 28px;
    margin-bottom: 20px;
  }
  
  .events-grid {
    grid-template-columns: 1fr;
    gap: 20px;
    margin-top: 30px;
  }
  
  .event-card {
    border-radius: 12px;
  }
  
  .event-card img {
    height: 200px;
  }
  
  .event-content {
    padding: 20px;
  }
  
  .event-content h3 {
    font-size: 18px;
    margin-bottom: 10px;
  }
  
  .event-content p {
    font-size: 13px;
    margin-bottom: 8px;
  }
  
  .event-date {
    font-size: 13px;
    margin-bottom: 12px;
  }
  
  .event-cta {
    padding: 12px 20px;
    font-size: 13px;
    display: block;
    text-align: center;
  }
  
  .loading,
  .no-events {
    padding: 30px 20px;
    font-size: 14px;
  }
}

@media (max-width: 480px) {
  /* Hero Section */
  .hero {
    padding: 40px 15px;
    min-height: 50vh;
  }
  
  .hero img {
    height: 150px;
  }
  
  .hero-content h1 {
    font-size: 24px;
  }
  
  .hero-content p {
    font-size: 14px;
  }
  
  /* Events Section */
  section {
    padding: 40px 15px;
  }
  
  #events h2 {
    font-size: 24px;
  }
  
  .event-card img {
    height: 160px;
  }
  
  .event-content {
    padding: 15px;
  }
  
  .event-content h3 {
    font-size: 16px;
  }
  
  .event-cta {
    padding: 10px 16px;
    font-size: 12px;
  }
}

/* MOBILE ANIMATIONS */

@media (max-width: 768px) {
  .hero img {
    animation: mobileFadeInUp 0.8s ease-out;
  }
  
  .hero-content h1 {
    animation: mobileFadeInUp 0.8s ease-out 0.2s both;
  }
  
  .hero-content p {
    animation: mobileFadeInUp 0.8s ease-out 0.4s both;
  }
  
  .event-card {
    opacity: 0;
    transform: translateY(30px);
    animation: mobileFadeInUp 0.6s ease-out forwards;
  }
  
  .event-card:nth-child(1) { animation-delay: 0.1s; }
  .event-card:nth-child(2) { animation-delay: 0.2s; }
  .event-card:nth-child(3) { animation-delay: 0.3s; }
  .event-card:nth-child(4) { animation-delay: 0.4s; }
  .event-card:nth-child(5) { animation-delay: 0.5s; }
  .event-card:nth-child(6) { animation-delay: 0.6s; }
}

/* TOUCH INTERACTIONS */

@media (hover: none) and (pointer: coarse) {
  .event-card:active {
    transform: scale(0.98);
    transition: transform 0.1s ease;
  }
  
  .event-cta:active {
    transform: scale(0.95);
    transition: transform 0.1s ease;
  }
}
  background-clip:text;
}

#events::before{
  content:'';
  display:block;
  width:80px;
  height:4px;
  background:var(--gradient);
  margin:0 auto 30px;
  border-radius:2px;
}

/* FOOTER */

footer{
  background:#0d0d0d;
  padding:50px 30px 30px;
  margin-top:100px;
  border-top:1px solid rgba(255,255,255,0.1);
}

.footer-content{
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:40px;
}

.footer-section h4{
  color:var(--accent);
  margin-bottom:20px;
  font-size:18px;
}

.footer-section p{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

.footer-section a{
  display:block;
  color:var(--muted);
  text-decoration:none;
  margin-bottom:10px;
  font-size:14px;
  transition:0.3s;
}

.footer-section a:hover{
  color:var(--accent);
}

.footer-bottom{
  max-width:1400px;
  margin:auto;
  margin-top:50px;
  padding-top:30px;
  border-top:1px solid rgba(255,255,255,0.1);
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* CARD */

.card{
  background:var(--card);
  padding:20px;
  border-radius:12px;
}

/* INPUTS */

input, select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:6px;
  border:none;
  background:#111;
  color:white;
}

/* BUTTON */

button{
  width:100%;
  padding:12px;
  background:var(--accent);
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

button:disabled{
  background:gray;
}

/* STATUS */

#status{
  margin-top:10px;
  text-align:center;
}

/* Navbar styles are now handled by navbar.js */

/* MOBILE RESPONSIVE STYLES */

@media(max-width:768px){
  section{
    padding:60px 20px;
  }
  
  .hero h1{
    font-size:42px;
    letter-spacing:-1px;
  }
  
  .hero p{
    font-size:16px;
  }
  
  .events-grid{
    grid-template-columns:1fr;
    gap:20px;
  }
  
  .event-card{
    padding:20px;
  }
  
  .event-card h3{
    font-size:22px;
  }
  
  .event-date{
    font-size:14px;
  }
  
  .event-description{
    font-size:14px;
  }
  
  .event-price{
    font-size:18px;
  }
  
  .btn{
    padding:12px 24px;
    font-size:14px;
  }
}

@media(max-width:480px){
  section{
    padding:40px 15px;
  }
  
  .hero h1{
    font-size:32px;
  }
  
  .hero p{
    font-size:14px;
  }
  
  .event-card{
    padding:15px;
  }
  
  .event-card h3{
    font-size:20px;
  }
  
  .event-date{
    font-size:13px;
  }
  
  .event-description{
    font-size:13px;
  }
  
  .event-price{
    font-size:16px;
  }
  
  .btn{
    padding:10px 20px;
    font-size:13px;
  }
}

</style>

</head>

<body>

<!-- EVENTS -->

<section class="hero">

<img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30">

<div class="hero-content animate-fadeInUp">
<h1 class="animate-fadeInDown stagger-1">TLDS Events</h1>
<p class="animate-fadeInUp stagger-2">Your Gateway to Amazing Experiences</p>
<p class="animate-fadeInUp stagger-3" style="font-size:14px; margin-top:10px; color:#888;">A service by Thinklab Digital Solutions LLP</p>
</div>

</section>

<!-- EVENTS -->

<section id="events" class="reveal">

<h2 class="animate-fadeInUp">Upcoming Events</h2>

<div id="eventsContainer" class="events-grid">
  <div class="loading">Loading events...</div>
</div>

</section>

<!-- PAST EVENTS -->

<section id="pastEvents" class="reveal">

<h2 class="animate-fadeInUp">Past Events</h2>

<div id="pastEventsContainer" class="events-grid">
  <div class="loading">Loading past events...</div>
</div>

</section>

<script>
async function loadEvents(){
  try{
    const response = await fetch(TLDS_CONFIG.ENDPOINTS.events);
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    const events = await response.json();
    
    const container = document.getElementById('eventsContainer');
    
    if(events.length === 0){
      container.innerHTML = '<div class="no-events">No events available at the moment. Check back soon!</div>';
      return;
    }
    
    container.innerHTML = events.map((event, index) => `
      <div class="event-card hover-lift reveal-scale stagger-${(index % 8) + 1}" onclick="window.location.href='event.html?id=${event._id}'" style="animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) ${index * 0.1}s forwards; opacity: 0;">
        <img src="${event.image}" alt="${event.title}">
        <div class="event-content">
          <h3>${event.title}</h3>
          <div class="event-date">${event.date} | ${event.time}</div>
          <p>${event.description}</p>
          <p>📍 ${event.venue}</p>
          <div class="event-cta">View Details & Book</div>
        </div>
      </div>
    `).join('');
    
  }catch(err){
    console.error('Error loading events:', err);
    document.getElementById('eventsContainer').innerHTML = '<div class="no-events">Failed to load events. Please try again later.</div>';
  }
}

async function loadPastEvents(){
  try{
    const response = await fetch(TLDS_CONFIG.ENDPOINTS.pastEvents);
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    const events = await response.json();
    
    const container = document.getElementById('pastEventsContainer');
    
    if(events.length === 0){
      container.innerHTML = '<div class="no-events">No past events available.</div>';
      return;
    }
    
    container.innerHTML = events.map((event, index) => `
      <div class="event-card past-event hover-lift reveal-scale stagger-${(index % 8) + 1}" style="animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) ${index * 0.1}s forwards; opacity: 0; opacity: 0.7;">
        <img src="${event.image}" alt="${event.title}">
        <div class="event-content">
          <h3>${event.title}</h3>
          <div class="event-date">${event.date} | ${event.time}</div>
          <p>${event.description}</p>
          <p>📍 ${event.venue}</p>
          <div class="event-cta" style="background: #666; cursor: default;">Event Ended</div>
        </div>
      </div>
    `).join('');
    
  }catch(err){
    console.error('Error loading past events:', err);
    document.getElementById('pastEventsContainer').innerHTML = '<div class="no-events">Failed to load past events. Please try again later.</div>';
  }
}

loadEvents();
loadPastEvents();
</script>

<script src="config.js"></script>
<script src="navbar.js"></script>
<script src="footer.js"></script>
<script src="animations.js"></script>

</body>
</html>
