<!DOCTYPE html>
<html>
<head>
<title>Event Details - TLDS Events | Thinklab Digital Solutions LLP</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animations.css">

<style>

html{
  scroll-behavior:smooth;
}

:root{
  --bg:#131414;
  --card:#1C1C1E;
  --accent:#A280FF;
  --text:#fff;
  --muted:#aaa;
  --gradient:linear-gradient(135deg, #A280FF 0%, #7B68EE 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
}

/* NAVBAR */

.navbar{
  width:100%;
  background:rgba(19,20,20,0.95);
  backdrop-filter:blur(10px);
  padding:15px 30px;
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.nav-container{
  max-width:1400px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo img{
  height:50px;
}

.nav-links{
  display:flex;
  gap:30px;
}

.nav-links a{
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  font-weight:500;
  transition:0.3s;
  position:relative;
}

.nav-links a:hover{
  color:var(--accent);
}

.nav-links a::after{
  content:'';
  position:absolute;
  bottom:-5px;
  left:0;
  width:0;
  height:2px;
  background:var(--accent);
  transition:0.3s;
}

.nav-links a:hover::after{
  width:100%;
}

@media(max-width:768px){
  .nav-links{
    display:none;
  }
}

/* SECTIONS */

section{
  padding:70px 20px;
  max-width:1100px;
  margin:auto;
}

/* EVENT HERO */

.event-hero{
  text-align:center;
}

.event-hero img{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:16px;
  margin-bottom:20px;
}

.event-hero h1{
  font-size:36px;
  margin-bottom:10px;
  color:var(--accent);
}

.event-hero .meta{
  color:var(--muted);
  font-size:18px;
  margin-bottom:20px;
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  align-items: center;
}

.event-hero .meta span{
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: all 0.3s ease;
}

.event-hero .meta span:hover {
  background: rgba(162,128,255,0.1);
  border-color: rgba(162,128,255,0.3);
  transform: translateY(-1px);
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:30px;
  margin-top:40px;
}

@media(max-width:768px){
  .grid{
    grid-template-columns:1fr;
  }
}

/* CARD */

.card{
  background:var(--card);
  padding:25px;
  border-radius:12px;
}

.card h2{
  color:var(--accent);
  margin-bottom:15px;
  font-size:24px;
}

.card p{
  line-height:1.8;
  color:#ddd;
  margin-bottom:15px;
}

/* BOOKING CARD */

.booking-card{
  background:var(--card);
  padding:25px;
  border-radius:12px;
  position:sticky;
  top:100px;
}

.booking-card h3{
  color:var(--accent);
  margin-bottom:20px;
  font-size:22px;
}

.price{
  font-size:28px;
  font-weight:600;
  color:#fff;
  margin-bottom:20px;
  padding: 15px;
  background: rgba(162,128,255,0.1);
  border-radius: 8px;
  border: 1px solid rgba(162,128,255,0.3);
  text-align: center;
  transition: all 0.3s ease;
}

.price span{
  color:var(--accent);
}

/* INPUTS */

input, select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:6px;
  border:none;
  background:#111;
  color:white;
  font-size:16px;
  color:var(--text);
  font-weight:400;
}

/* BUTTON */

button{
  width:100%;
  padding:12px;
  background:var(--accent);
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
  font-weight:600;
}

button:disabled{
  background:gray;
}

#status{
  margin-top:10px;
  text-align:center;
}

#availability{
  text-align:center;
  margin-bottom:15px;
  color:#4ade80;
  font-size:14px;
}

.back-link{
  display:inline-flex;
  align-items: center;
  margin-bottom:20px;
  padding: 8px 16px;
  background: var(--card);
  color:var(--text);
  text-decoration:none;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: all 0.3s ease;
  font-size: 14px;
}

.back-link:hover{
  color:var(--accent);
  background: rgba(162,128,255,0.1);
  border-color: rgba(162,128,255,0.3);
  transform: translateY(-2px);
}

.no-events{
  text-align:center;
  padding:50px;
  color:var(--muted);
}

.loading{
  text-align:center;
  padding:50px;
  color:var(--muted);
}

.error{
  text-align:center;
  padding:50px;
  color:#ff6b6b;
}

/* FOOTER */

footer{
  background:#0d0d0d;
  padding:50px 30px 30px;
  margin-top:100px;
  border-top:1px solid rgba(255,255,255,0.1);
}

.footer-content{
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:40px;
}

.footer-section h4{
  color:var(--accent);
  margin-bottom:20px;
  font-size:18px;
}

.footer-section p{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

.footer-section a{
  display:block;
  color:var(--muted);
  text-decoration:none;
  margin-bottom:10px;
  font-size:14px;
  transition:0.3s;
}

.footer-section a:hover{
  color:var(--accent);
}

.footer-bottom{
  max-width:1400px;
  margin:auto;
  margin-top:50px;
  padding-top:30px;
  border-top:1px solid rgba(255,255,255,0.1);
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* MOBILE RESPONSIVE STYLES */

@media (max-width: 768px) {
  .event-detail {
    padding: 40px 20px;
  }
  
  .back-link {
    font-size: 14px;
    margin-bottom: 20px;
    display: inline-block;
    padding: 8px 16px;
    background: var(--card);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  .event-hero img {
    height: 200px;
    border-radius: 12px;
  }
  
  .event-hero h1 {
    font-size: 28px;
    margin-bottom: 15px;
  }
  
  .event-hero .meta {
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
  }
  
  .grid {
    grid-template-columns: 1fr;
    gap: 20px;
    margin-top: 30px;
  }
  
  .card {
    padding: 20px;
  }
  
  .card h2 {
    font-size: 20px;
    margin-bottom: 15px;
  }
  
  .card p {
    font-size: 14px;
    line-height: 1.6;
  }
  
  .booking-card {
    padding: 20px;
  }
  
  .booking-card h3 {
    font-size: 18px;
    margin-bottom: 15px;
  }
  
  #availability {
    font-size: 13px;
    margin-bottom: 15px;
    padding: 8px;
    background: rgba(162,128,255,0.1);
    border-radius: 6px;
  }
  
  input, select {
    padding: 12px 16px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  
  .price {
    font-size: 16px;
    margin-bottom: 15px;
  }
  
  #payBtn {
    width: 100%;
    padding: 14px 20px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  
  #status {
    font-size: 13px;
  }
}

@media (max-width: 480px) {
  .event-detail {
    padding: 20px 15px;
  }
  
  .event-hero img {
    height: 150px;
  }
  
  .event-hero h1 {
    font-size: 24px;
  }
  
  .card {
    padding: 15px;
  }
  
  .booking-card {
    padding: 15px;
  }
  
  input, select {
    padding: 10px 14px;
    font-size: 13px;
  }
  
  .price {
    font-size: 15px;
  }
  
  #payBtn {
    padding: 12px 16px;
    font-size: 13px;
  }
}

/* MOBILE ANIMATIONS */

@media (max-width: 768px) {
  .event-hero {
    animation: mobileFadeInUp 0.8s ease-out;
  }
  
  .card {
    animation: mobileFadeInUp 0.8s ease-out 0.2s both;
  }
  
  .booking-card {
    animation: mobileFadeInUp 0.8s ease-out 0.4s both;
  }
}

/* TOUCH INTERACTIONS */

@media (hover: none) and (pointer: coarse) {
  .back-link:active {
    transform: scale(0.95);
    transition: transform 0.1s ease;
  }
  
  #payBtn:active {
    transform: scale(0.98);
    transition: transform 0.1s ease;
  }
  
  input:focus, select:focus {
    transform: scale(1.02);
    transition: transform 0.1s ease;
  }
}

</style>

</head>

<body>

<!-- SCROLL PROGRESS BAR -->
<div class="scroll-progress"></div>

<section class="event-detail reveal animate-fadeInUp">
  <a href="index.html" class="back-link">← Back to Events</a>
  
  <div id="eventContainer">
    <div class="loading">Loading event details...</div>
  </div>
</section>

<script src="script.js"></script>

<script>
const urlParams = new URLSearchParams(window.location.search);
const eventId = urlParams.get('id');

async function loadEvent(){
  if(!eventId){
    document.getElementById('eventContainer').innerHTML = '<div class="error">Event ID not provided</div>';
    return;
  }

  try{
    const response = await fetch(`https://tldsevents-backend.onrender.com/events/${eventId}`);
    const event = await response.json();

    if(!event){
      document.getElementById('eventContainer').innerHTML = '<div class="error">Event not found</div>';
      return;
    }

    // Store event prices globally
    window.eventSinglePrice = event.singlePrice;
    window.eventCouplePrice = event.couplePrice;
    window.currentEventId = event._id;
    window.currentEventTitle = event.title;

    document.getElementById('eventContainer').innerHTML = `
      <div class="event-hero">
        <img src="${event.image}" alt="${event.title}">
        <h1>${event.title}</h1>
        <div class="meta">
          <span>📅 ${event.date}</span>
          <span>⏰ ${event.time}</span>
          <span>📍 ${event.venue}</span>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <h2>About This Event</h2>
          <p>${event.longDescription || event.description}</p>
        </div>

        <div class="booking-card">
          <h3>Book Your Ticket</h3>
          <div id="availability">Checking availability...</div>
          
          <input id="name" placeholder="Full Name">
          <input id="email" placeholder="Email Address">

          <select id="ticketType" onchange="updatePrice(); updateQuantityLimit()">
            <option value="">Select Ticket Type</option>
            <option value="single">Single Ticket - ₹${event.singlePrice}</option>
            <option value="couple">Couple Ticket - ₹${event.couplePrice}</option>
          </select>

          <input id="quantity" type="number" min="1" max="10" value="1" placeholder="Quantity" onchange="updatePrice()" oninput="validateQuantity(this)">

          <div class="price" id="totalPrice">Total: ₹0</div>

          <button onclick="initiatePayment()" id="payBtn">Proceed to Payment</button>

          <div id="status"></div>
        </div>
      </div>
    `;

    loadAvailability(event._id);

  }catch(err){
    console.error('Error loading event:', err);
    document.getElementById('eventContainer').innerHTML = '<div class="error">Failed to load event details. Please try again later.</div>';
  }
}

function loadAvailability(eventId){
  fetch(`https://tldsevents-backend.onrender.com/availability?eventId=${eventId}`)
    .then(res => res.json())
    .then(data => {
      const availabilityDiv = document.getElementById('availability');
      availabilityDiv.innerHTML = `
        Single Available: ${data.singleAvailable} | Couple Available: ${data.coupleAvailable}
      `;
    })
    .catch(err => {
      console.error('Error loading availability:', err);
    });
}

function updatePrice(){
  const ticketType = document.getElementById('ticketType').value;
  const quantity = parseInt(document.getElementById('quantity').value) || 0;
  
  let pricePerTicket = 0;
  if(ticketType === 'single'){
    pricePerTicket = window.eventSinglePrice || 0;
  }else if(ticketType === 'couple'){
    pricePerTicket = window.eventCouplePrice || 0;
  }
  
  const total = pricePerTicket * quantity;
  document.getElementById('totalPrice').textContent = `Total: ₹${total}`;
}

function updateQuantityLimit(){
  const ticketType = document.getElementById('ticketType').value;
  const quantityInput = document.getElementById('quantity');
  
  if(ticketType === 'single'){
    quantityInput.max = 10;
  }else if(ticketType === 'couple'){
    quantityInput.max = 5;
  }else{
    quantityInput.max = 10;
  }
  
  quantityInput.value = 1;
  updatePrice();
}

function validateQuantity(input){
  const max = parseInt(input.max) || 10;
  if(parseInt(input.value) > max){
    input.value = max;
  }
  updatePrice();
}

async function initiatePayment(){
  const ticketType = document.getElementById('ticketType').value;
  const quantity = parseInt(document.getElementById('quantity').value) || 0;
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const status = document.getElementById('status');
  const payBtn = document.getElementById('payBtn');

  if(!ticketType || !quantity || !name || !email){
    status.style.color = "#ff6b6b";
    status.textContent = "Please fill all fields";
    return;
  }

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!emailRegex.test(email)){
    status.style.color = "#ff6b6b";
    status.textContent = "Please enter a valid email";
    return;
  }

  if(ticketType === "single" && quantity > 10){
    status.style.color = "#ff6b6b";
    status.textContent = "Max 10 single tickets allowed";
    return;
  }

  if(ticketType === "couple" && quantity > 5){
    status.style.color = "#ff6b6b";
    status.textContent = "Max 5 couple tickets allowed";
    return;
  }

  let pricePerTicket = 0;
  if(ticketType === "single") pricePerTicket = window.eventSinglePrice;
  else if(ticketType === "couple") pricePerTicket = window.eventCouplePrice;

  const amount = pricePerTicket * quantity;

  payBtn.disabled = true;
  status.style.color = "#4ade80";
  status.textContent = "Creating order...";

  try{
    // Get Razorpay key from config
    const configRes = await fetch("https://tldsevents-backend.onrender.com/config");
    if(!configRes.ok) throw new Error("Failed to get config");
    const {key} = await configRes.json();
    
    console.log("Razorpay Key:", key);
    console.log("Amount:", amount);

    // Create order
    const orderRes = await fetch("https://tldsevents-backend.onrender.com/create-order",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({amount})
    });
    
    if(!orderRes.ok) throw new Error("Failed to create order");
    const order = await orderRes.json();

    console.log("Order created:", order);

    if(order.error){
      status.style.color = "#ff6b6b";
      status.textContent = order.error;
      payBtn.disabled = false;
      return;
    }

    const options = {
      key: key,
      amount: order.amount,
      currency: "INR",
      name: "TLDS Events",
      description: window.currentEventTitle,
      order_id: order.id,
      handler: function(response){
        console.log("Payment successful:", response);
        status.textContent = "Verifying payment...";
        
        fetch("https://tldsevents-backend.onrender.com/verify-payment",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature,
            name,
            email,
            ticketType,
            quantity,
            eventId: window.currentEventId,
            eventTitle: window.currentEventTitle
          })
        })
        .then(res=>res.json())
        .then(result=>{
          if(result.status === "success"){
            const qrData = encodeURIComponent(result.qrData);
            window.location.href = `success.html?booking=${result.bookingId}&qr=${qrData}&qty=${result.quantity}&type=${result.ticketType}&name=${encodeURIComponent(result.name)}`;
          }else if(result.status === "sold_out"){
            status.style.color = "#ff6b6b";
            status.textContent = "Sorry, tickets are sold out!";
            payBtn.disabled = false;
          }else if(result.status === "max_limit"){
            status.style.color = "#ff6b6b";
            status.textContent = "Maximum booking limit exceeded";
            payBtn.disabled = false;
          }else{
            status.style.color = "#ff6b6b";
            status.textContent = "Payment verification failed";
            payBtn.disabled = false;
          }
        })
        .catch(err=>{
          console.error("Verification error:", err);
          status.style.color = "#ff6b6b";
          status.textContent = "Error verifying payment";
          payBtn.disabled = false;
        });
      },
      prefill: {
        name: name,
        email: email
      },
      theme: {
        color: "#A280FF"
      }
    };

    const rzp1 = new Razorpay(options);
    rzp1.open();
    rzp1.on('payment.failed', function(response){
      status.style.color = "#ff6b6b";
      status.textContent = "Payment failed. Please try again.";
      payBtn.disabled = false;
    });

  }catch(err){
    console.error("Payment error:", err);
    status.style.color = "#ff6b6b";
    status.textContent = "Error creating order. Please try again.";
    payBtn.disabled = false;
  }
}

loadEvent();
</script>

<script src="navbar.js"></script>
<script src="footer.js"></script>
<script src="animations.js"></script>

</body>
</html>
