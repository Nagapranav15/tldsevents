<!DOCTYPE html>
<html>
<head>
<title>Event Details - TLDS Events | Thinklab Digital Solutions LLP</title>
<meta name="description" content="Register for PR events and digital experiences on TLDS Events. Secure ticket booking, instant confirmation, and professional event management by ThinkLab Digital Solutions LLP.">
<meta name="keywords" content="event registration, PR events, digital events, ticket booking, event management, ThinkLab Digital Solutions">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="animations.css">

<style>
/* Page-specific styles */

/* SECTIONS */

section{
  padding:70px 20px;
  max-width:1100px;
  margin:auto;
}

/* EVENT HERO */

.event-hero{
  text-align:center;
}

.event-hero img{
  width:100%;
  height:400px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:0;
}

.event-hero-content {
  position: relative;
  margin-top: -60px;
  padding: 0 30px 30px;
  z-index: 10;
}

.event-hero .event-category-badge {
  display: inline-block;
  background: var(--gradient);
  color: white;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 15px;
  box-shadow: 0 4px 12px rgba(162, 128, 255, 0.4);
}

.event-hero h1{
  font-size:36px;
  margin-bottom:15px;
  background:var(--gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  font-weight:700;
}

.event-hero .meta{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:14px;
}

.event-hero .meta span{
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: all 0.3s ease;
}

.event-hero .meta span:hover {
  background: rgba(162,128,255,0.1);
  border-color: rgba(162,128,255,0.3);
  transform: translateY(-1px);
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:30px;
  margin-top:40px;
}

@media(max-width:768px){
  .grid{
    grid-template-columns:1fr;
  }
}

/* EVENT LAYOUT */

.event-layout {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 30px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 30px 60px;
}

.event-main {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.event-sidebar {
  display: flex;
  flex-direction: column;
  gap: 30px;
}

/* EVENT DETAILS GRID */

.event-details-grid {
  display: grid;
  gap: 20px;
}

.detail-item {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 15px;
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.05);
}

.detail-label {
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
}

.detail-value {
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
}

/* ORGANIZER INFO */

.organizer-info {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.organizer-name {
  font-size: 18px;
  font-weight: 600;
  color: var(--accent);
}

.organizer-desc {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
}

.organizer-contact {
  color: var(--text);
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* INSTRUCTIONS LIST */

.instructions-list {
  list-style: none;
  padding: 0;
}

.instructions-list li {
  padding: 12px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.instructions-list li::before {
  content: "✓";
  color: var(--accent);
  font-weight: 600;
  flex-shrink: 0;
}

/* POLICY TEXT & LINK */

.policy-text {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 15px;
}

.policy-link {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  transition: 0.3s;
}

.policy-link:hover {
  color: #7B68EE;
}

/* FAQ */

.faq-item {
  padding: 15px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.faq-question {
  font-weight: 600;
  color: var(--text);
  font-size: 15px;
  margin-bottom: 8px;
}

.faq-answer {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

/* TRUST BADGES */

.trust-badges {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 15px 0;
}

.trust-badge {
  background: rgba(162, 128, 255, 0.1);
  border: 1px solid rgba(162, 128, 255, 0.3);
  color: var(--accent);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  text-align: center;
}

/* SIDEBAR CARD */

.sidebar-card {
  padding: 20px;
}

.contact-info {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 10px;
}

.contact-info span {
  color: var(--muted);
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* CARD */

.card{
  background:var(--card);
  padding:25px;
  border-radius:12px;
}

.card h2{
  color:var(--accent);
  margin-bottom:15px;
  font-size:24px;
}

.card p{
  line-height:1.8;
  color:#ddd;
  margin-bottom:15px;
}

/* BOOKING CARD */

.booking-card{
  background:var(--card);
  padding:25px;
  border-radius:12px;
  position:sticky;
  top:100px;
}

.booking-card h3{
  color:var(--accent);
  margin-bottom:20px;
  font-size:22px;
}

.price{
  font-size:28px;
  font-weight:600;
  color:#fff;
  margin-bottom:20px;
  padding: 15px;
  background: rgba(162,128,255,0.1);
  border-radius: 8px;
  border: 1px solid rgba(162,128,255,0.3);
  text-align: center;
  transition: all 0.3s ease;
}

.price span{
  color:var(--accent);
}

/* INPUTS */

input, select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:6px;
  border:none;
  background:#111;
  color:white;
  font-size:16px;
  color:var(--text);
  font-weight:400;
}

/* BUTTON */

button{
  width:100%;
  padding:12px;
  background:var(--accent);
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
  font-weight:600;
}

button:disabled{
  background:gray;
}

#status{
  margin-top:10px;
  text-align:center;
}

#availability{
  text-align:center;
  margin-bottom:15px;
  color:#4ade80;
  font-size:14px;
}

.back-link{
  display:inline-flex;
  align-items: center;
  margin-bottom:20px;
  padding: 8px 16px;
  background: var(--card);
  color:var(--text);
  text-decoration:none;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  transition: all 0.3s ease;
  font-size: 14px;
}

.back-link:hover{
  color:var(--accent);
  background: rgba(162,128,255,0.1);
  border-color: rgba(162,128,255,0.3);
  transform: translateY(-2px);
}

.no-events{
  text-align:center;
  padding:50px;
  color:var(--muted);
}

.loading{
  text-align:center;
  padding:50px;
  color:var(--muted);
}

.error{
  text-align:center;
  padding:50px;
  color:#ff6b6b;
}

/* FOOTER */

footer{
  background:#0d0d0d;
  padding:50px 30px 30px;
  margin-top:100px;
  border-top:1px solid rgba(255,255,255,0.1);
}

.footer-content{
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:40px;
}

.footer-section h4{
  color:var(--accent);
  margin-bottom:20px;
  font-size:18px;
}

.footer-section p{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

.footer-section a{
  display:block;
  color:var(--muted);
  text-decoration:none;
  margin-bottom:10px;
  font-size:14px;
  transition:0.3s;
}

.footer-section a:hover{
  color:var(--accent);
}

.footer-bottom{
  max-width:1400px;
  margin:auto;
  margin-top:50px;
  padding-top:30px;
  border-top:1px solid rgba(255,255,255,0.1);
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

/* MOBILE RESPONSIVE STYLES */

@media (max-width: 768px) {
  .event-detail {
    padding: 40px 20px;
  }
  
  .back-link {
    font-size: 14px;
    margin-bottom: 20px;
    display: inline-block;
    padding: 8px 16px;
    background: var(--card);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  
  .event-hero img {
    height: 200px;
    border-radius: 12px;
  }
  
  .event-hero h1 {
    font-size: 28px;
    margin-bottom: 15px;
  }
  
  .event-hero .meta {
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
  }
  
  .grid {
    grid-template-columns: 1fr;
    gap: 20px;
    margin-top: 30px;
  }
  
  .card {
    padding: 20px;
  }
  
  .card h2 {
    font-size: 20px;
  }
  
  .booking-card {
    padding: 20px;
  }
  
  #availability {
    font-size: 13px;
    margin-bottom: 15px;
    padding: 8px;
    background: rgba(162,128,255,0.1);
    border-radius: 6px;
  }
  
  input, select {
    padding: 12px 16px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  
  .price {
    font-size: 16px;
    margin-bottom: 15px;
  }
  
  #payBtn {
    width: 100%;
    padding: 14px 20px;
    font-size: 14px;
    margin-bottom: 10px;
  }
  
  #status {
    font-size: 13px;
  }
}

@media (max-width: 480px) {
  .event-detail {
    padding: 20px 15px;
  }
  
  .event-hero img {
    height: 150px;
  }
  
  .event-hero h1 {
    font-size: 24px;
  }
  
  .card {
    padding: 15px;
  }
  
  .booking-card {
    padding: 15px;
  }
  
  input, select {
    padding: 10px 14px;
    font-size: 13px;
  }
  
  .price {
    font-size: 15px;
  }
  
  #payBtn {
    padding: 12px 16px;
    font-size: 13px;
  }
}

/* MOBILE ANIMATIONS */

@media (max-width: 768px) {
  .event-hero {
    animation: mobileFadeInUp 0.8s ease-out;
  }
  
  .card {
    animation: mobileFadeInUp 0.8s ease-out 0.2s both;
  }
  
  .booking-card {
    animation: mobileFadeInUp 0.8s ease-out 0.4s both;
  }
}

/* TOUCH INTERACTIONS */

@media (hover: none) and (pointer: coarse) {
  .back-link:active {
    transform: scale(0.95);
    transition: transform 0.1s ease;
  }
  
  #payBtn:active {
    transform: scale(0.98);
    transition: transform 0.1s ease;
  }
  
  input:focus, select:focus {
    transform: scale(1.02);
    transition: transform 0.1s ease;
  }
}

</style>

</head>

<body>

<!-- SCROLL PROGRESS BAR -->
<div class="scroll-progress"></div>

<section class="event-detail reveal animate-fadeInUp">
  <a href="index.html" class="back-link">← Back to Events</a>
  
  <div id="eventContainer">
    <div class="loading">Loading event details...</div>
  </div>
</section>

<script src="config.js"></script>
<script src="content-protection.js"></script>
<script src="script.js"></script>

<script>
const urlParams = new URLSearchParams(window.location.search);
const eventId = urlParams.get('id');
const eventName = urlParams.get('name');

async function loadEvent(){
  if(!eventId && !eventName){
    document.getElementById('eventContainer').innerHTML = '<div class="error">Event ID or Name not provided</div>';
    return;
  }

  try{
    // Build endpoint based on whether ID or name is provided
    const endpoint = eventId 
      ? TLDS_CONFIG.ENDPOINTS.event(eventId)
      : `${TLDS_CONFIG.BASE_URL}/event-by-name?name=${encodeURIComponent(eventName)}`;
    
    const response = await fetch(endpoint);
    const event = await response.json();

    if(!event){
      document.getElementById('eventContainer').innerHTML = '<div class="error">Event not found</div>';
      return;
    }

    // Store event prices globally
    window.eventSinglePrice = event.singlePrice;
    window.eventCouplePrice = event.couplePrice;
    window.currentEventId = event._id;
    window.currentEventTitle = event.title;

    document.getElementById('eventContainer').innerHTML = `
      <div class="event-hero">
        <img src="${event.image}" alt="${event.title}">
        <div class="event-hero-content">
          <div class="event-category-badge">PR Event</div>
          <h1>${event.title}</h1>
          <div class="meta">
            <span>📅 ${event.date}</span>
            <span>⏰ ${event.time}</span>
            <span>📍 ${event.venue}</span>
          </div>
        </div>
      </div>

      <div class="event-layout">
        <div class="event-main">
          <div class="card">
            <h2>About This Event</h2>
            <p>${event.longDescription || event.description}</p>
          </div>

          <div class="card">
            <h2>Event Details</h2>
            <div class="event-details-grid">
              <div class="detail-item">
                <span class="detail-label">Date</span>
                <span class="detail-value">${event.date}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Time</span>
                <span class="detail-value">${event.time}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Venue</span>
                <span class="detail-value">${event.venue}</span>
              </div>
            </div>
          </div>

          <div class="card">
            <h2>Organizer Information</h2>
            <div class="organizer-info">
              <div class="organizer-name">ThinkLab Digital Solutions LLP</div>
              <div class="organizer-desc">Professional PR Events & Digital Event Experiences</div>
              <div class="organizer-contact">
                <span>📧 info@thinklabdigitalsolutions.com</span>
              </div>
            </div>
          </div>

          <div class="card">
            <h2>Attendee Instructions</h2>
            <ul class="instructions-list">
              <li>Please arrive 30 minutes before the event start time</li>
              <li>Carry a valid ID proof for verification</li>
              <li>Display your QR code ticket at the entrance</li>
              <li>Follow all venue rules and regulations</li>
            </ul>
          </div>

          <div class="card">
            <h2>Refund & Cancellation Policy</h2>
            <p class="policy-text">Please review our refund policy before booking. Contact us at info@thinklabdigitalsolutions.com for any queries regarding cancellations.</p>
            <a href="refund.html" class="policy-link">View Full Refund Policy →</a>
          </div>

          <div class="card">
            <h2>Frequently Asked Questions</h2>
            <div class="faq-item">
              <div class="faq-question">How do I receive my ticket?</div>
              <div class="faq-answer">After successful payment, you will receive your ticket via email with a QR code for entry.</div>
            </div>
            <div class="faq-item">
              <div class="faq-question">Can I transfer my ticket?</div>
              <div class="faq-answer">Tickets are non-transferable. The name on the ticket must match the attendee's ID.</div>
            </div>
            <div class="faq-item">
              <div class="faq-question">What if the event is cancelled?</div>
              <div class="faq-answer">In case of event cancellation, full refunds will be processed automatically.</div>
            </div>
          </div>
        </div>

        <div class="event-sidebar">
          <div class="booking-card">
            <h3>Register for Event</h3>
            <div id="availability">Checking availability...</div>
            
            <input id="name" placeholder="Full Name">
            <input id="email" placeholder="Email Address">

            <select id="ticketType" onchange="updatePrice(); updateQuantityLimit()">
              <option value="">Select Ticket Type</option>
              <option value="single">Single Ticket - ₹${event.singlePrice}</option>
              <option value="couple">Couple Ticket - ₹${event.couplePrice}</option>
            </select>

            <input id="quantity" type="number" min="1" max="10" value="1" placeholder="Quantity" onchange="updatePrice()" oninput="validateQuantity(this)">

            <div class="price" id="totalPrice">Total: ₹0</div>

            <div class="trust-badges">
              <span class="trust-badge">✓ Secure Payment</span>
              <span class="trust-badge">✓ Instant Confirmation</span>
            </div>

            <button onclick="initiatePayment()" id="payBtn">Proceed to Payment</button>

            <div id="status"></div>
          </div>

          <div class="card sidebar-card">
            <h3>Need Help?</h3>
            <p>Contact our support team for assistance.</p>
            <div class="contact-info">
              <span>📧 info@thinklabdigitalsolutions.com</span>
            </div>
          </div>
        </div>
      </div>
    `;

    loadAvailability(event._id);

  }catch(err){
    console.error('Error loading event:', err);
    document.getElementById('eventContainer').innerHTML = '<div class="error">Failed to load event details. Please try again later.</div>';
  }
}

function loadAvailability(eventId){
  fetch(`${TLDS_CONFIG.ENDPOINTS.availability}?eventId=${eventId}`)
    .then(res => res.json())
    .then(data => {
      const availabilityDiv = document.getElementById('availability');
      availabilityDiv.innerHTML = `
        Single Available: ${data.singleAvailable} | Couple Available: ${data.coupleAvailable}
      `;
    })
    .catch(err => {
      console.error('Error loading availability:', err);
    });
}

function updatePrice(){
  const ticketType = document.getElementById('ticketType').value;
  const quantity = parseInt(document.getElementById('quantity').value) || 0;
  
  let pricePerTicket = 0;
  if(ticketType === 'single'){
    pricePerTicket = window.eventSinglePrice || 0;
  }else if(ticketType === 'couple'){
    pricePerTicket = window.eventCouplePrice || 0;
  }
  
  const total = pricePerTicket * quantity;
  document.getElementById('totalPrice').textContent = `Total: ₹${total}`;
}

function updateQuantityLimit(){
  const ticketType = document.getElementById('ticketType').value;
  const quantityInput = document.getElementById('quantity');
  
  if(ticketType === 'single'){
    quantityInput.max = 10;
  }else if(ticketType === 'couple'){
    quantityInput.max = 5;
  }else{
    quantityInput.max = 10;
  }
  
  quantityInput.value = 1;
  updatePrice();
}

function validateQuantity(input){
  const max = parseInt(input.max) || 10;
  if(parseInt(input.value) > max){
    input.value = max;
  }
  updatePrice();
}

async function initiatePayment(){
  const ticketType = document.getElementById('ticketType').value;
  const quantity = parseInt(document.getElementById('quantity').value) || 0;
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const status = document.getElementById('status');
  const payBtn = document.getElementById('payBtn');

  if(!ticketType || !quantity || !name || !email){
    status.style.color = "#ff6b6b";
    status.textContent = "Please fill all fields";
    return;
  }

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!emailRegex.test(email)){
    status.style.color = "#ff6b6b";
    status.textContent = "Please enter a valid email";
    return;
  }

  if(ticketType === "single" && quantity > 10){
    status.style.color = "#ff6b6b";
    status.textContent = "Max 10 single tickets allowed";
    return;
  }

  if(ticketType === "couple" && quantity > 5){
    status.style.color = "#ff6b6b";
    status.textContent = "Max 5 couple tickets allowed";
    return;
  }

  let pricePerTicket = 0;
  if(ticketType === "single") pricePerTicket = window.eventSinglePrice;
  else if(ticketType === "couple") pricePerTicket = window.eventCouplePrice;

  const amount = pricePerTicket * quantity;

  payBtn.disabled = true;
  status.style.color = "#4ade80";
  status.textContent = "Creating order...";

  try{
    // Get Razorpay key from config
    const configRes = await fetch(TLDS_CONFIG.ENDPOINTS.config);
    if(!configRes.ok) throw new Error("Failed to get config");
    const {key} = await configRes.json();
    
    console.log("Razorpay Key:", key);
    console.log("Amount:", amount);

    // Create order
    const orderRes = await fetch(TLDS_CONFIG.ENDPOINTS.createOrder,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({amount})
    });
    
    if(!orderRes.ok) throw new Error("Failed to create order");
    const order = await orderRes.json();

    console.log("Order created:", order);

    if(order.error){
      status.style.color = "#ff6b6b";
      status.textContent = order.error;
      payBtn.disabled = false;
      return;
    }

    const options = {
      key: key,
      amount: order.amount,
      currency: "INR",
      name: "TLDS Events",
      description: window.currentEventTitle,
      order_id: order.id,
      handler: function(response){
        console.log("Payment successful:", response);
        status.textContent = "Verifying payment...";
        
        fetch(TLDS_CONFIG.ENDPOINTS.verifyPayment,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify({
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature,
            name,
            email,
            ticketType,
            quantity,
            eventId: window.currentEventId,
            eventTitle: window.currentEventTitle
          })
        })
        .then(res=>res.json())
        .then(result=>{
          if(result.status === "success"){
            const qrData = encodeURIComponent(result.qrData);
            window.location.href = `success.html?booking=${result.bookingId}&qr=${qrData}&qty=${result.quantity}&type=${result.ticketType}&name=${encodeURIComponent(result.name)}`;
          }else if(result.status === "sold_out"){
            status.style.color = "#ff6b6b";
            status.textContent = "Sorry, tickets are sold out!";
            payBtn.disabled = false;
          }else if(result.status === "max_limit"){
            status.style.color = "#ff6b6b";
            status.textContent = "Maximum booking limit exceeded";
            payBtn.disabled = false;
          }else{
            status.style.color = "#ff6b6b";
            status.textContent = "Payment verification failed";
            payBtn.disabled = false;
          }
        })
        .catch(err=>{
          console.error("Verification error:", err);
          status.style.color = "#ff6b6b";
          status.textContent = "Error verifying payment";
          payBtn.disabled = false;
        });
      },
      prefill: {
        name: name,
        email: email
      },
      theme: {
        color: "#A280FF"
      }
    };

    const rzp1 = new Razorpay(options);
    rzp1.open();
    rzp1.on('payment.failed', function(response){
      status.style.color = "#ff6b6b";
      status.textContent = "Payment failed. Please try again.";
      payBtn.disabled = false;
    });

  }catch(err){
    console.error("Payment error:", err);
    status.style.color = "#ff6b6b";
    status.textContent = "Error creating order. Please try again.";
    payBtn.disabled = false;
  }
}

loadEvent();
</script>
