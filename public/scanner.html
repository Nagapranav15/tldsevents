<!DOCTYPE html>
<html>
<head>
    <title>QR Scanner - TLDS Events | Thinklab Digital Solutions LLP</title>
    <meta name="description" content="Secure QR code scanner for event entry verification. TLDS Events - Professional PR event management with digital ticket validation.">
    <meta name="keywords" content="QR scanner, event entry verification, ticket validation, PR events, event management, ThinkLab Digital Solutions">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="animations.css">
    <style>
        /* Page-specific styles */
        :root {
            --primary: #e50914;
            --secondary: #221f1f;
            --success: #46d369;
            --warning: #f9ab00;
            --danger: #e87c03;
            --bg-dark: #141414;
            --bg-card: #1f1f1f;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --border: #404040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo::before {
            content: "🎟";
            font-size: 1.8rem;
        }

        .scanner-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .scanner-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .scanner-section {
                grid-template-columns: 1fr;
            }
        }

        /* Scanner Card */
        .scanner-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .scanner-card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title::before {
            content: "📱";
        }

        #reader {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }

        /* Result Card */
        .result-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .result-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .result-title::before {
            content: "🎫";
        }

        /* Ticket Display */
        .ticket-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .ticket-display::before {
            content: "";
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .ticket-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            position: relative;
            z-index: 1;
        }

        .booking-id {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }

        .ticket-status {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-valid {
            background: var(--success);
            color: #fff;
        }

        .status-used {
            background: var(--danger);
            color: #fff;
        }

        .ticket-details {
            display: grid;
            gap: 0.8rem;
            position: relative;
            z-index: 1;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .detail-value {
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #f40612;
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #3ab54a;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Error States */
        .error-message {
            background: rgba(229, 9, 20, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            margin: 1rem 0;
        }

        .success-message {
            background: rgba(70, 211, 105, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            margin: 1rem 0;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .loading::after {
            content: "";
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-secondary);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <div class="logo">TLDS Events Scanner</div>
            <div class="scanner-status">
                <span class="status-dot"></span>
                <span>Scanner Active</span>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="scanner-section">
            <div class="scanner-card">
                <h2 class="card-title">Scan QR Code</h2>
                <div id="reader"></div>
                <div id="scanError" class="error-message" style="display: none;"></div>
            </div>

            <div class="result-card">
                <h2 class="result-title">Ticket Details</h2>
                <div id="result">
                    <div class="empty-state">
                        <div class="empty-state-icon">📷</div>
                        <p>Scan a QR code to view ticket details</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Using centralized config from config.js
        // BASE_URL is automatically set based on environment
        
        let scanning = true;
        const result = document.getElementById("result");
        const scanError = document.getElementById("scanError");

        // Initialize scanner
        const html5QrCode = new Html5Qrcode("reader");

        // Start camera
        Html5Qrcode.getCameras()
            .then(devices => {
                if (devices && devices.length) {
                    html5QrCode.start(
                        { facingMode: "environment" },
                        { 
                            fps: 10, 
                            qrbox: { width: 250, height: 250 },
                            aspectRatio: 1.0
                        },
                        (decodedText) => {
                            handleScan(decodedText);
                        },
                        (error) => {
                            // Silent scan errors
                        }
                    );
                } else {
                    showError("No camera found");
                }
            })
            .catch(err => {
                console.error("Camera error:", err);
                showError("Camera access failed");
            });

        function showError(message) {
            scanError.textContent = message;
            scanError.style.display = 'block';
            setTimeout(() => {
                scanError.style.display = 'none';
            }, 3000);
        }

        function handleScan(decodedText) {
            if (!scanning) return;
            scanning = false;

            let data;
            try {
                data = JSON.parse(decodedText);
            } catch {
                result.innerHTML = '<div class="error-message">❌ Invalid QR Code</div>';
                setTimeout(() => { scanning = true; }, 2000);
                return;
            }

            console.log("QR Data:", data);

            // Display loading state
            result.innerHTML = '<div class="loading">Validating ticket...</div>';

            // Validate ticket
            fetch(TLDS_CONFIG.ENDPOINTS.checkBooking, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ bookingId: data.bookingId })
            })
            .then(res => res.json())
            .then(res => {
                console.log("Backend response:", res);

                if (res.status !== "ok") {
                    result.innerHTML = '<div class="error-message">❌ Invalid Booking</div>';
                    setTimeout(() => { scanning = true; }, 2000);
                    return;
                }

                // Display ticket details
                displayTicket(data, res);
            })
            .catch(err => {
                console.error("Fetch error:", err);
                result.innerHTML = '<div class="error-message">❌ Server Error</div>';
                setTimeout(() => { scanning = true; }, 2000);
            });
        }

        function displayTicket(qrData, bookingData) {
            const isValid = !bookingData.used;
            
            result.innerHTML = `
                <div class="ticket-display">
                    <div class="ticket-header">
                        <div class="booking-id">${qrData.bookingId}</div>
                        <div class="ticket-status ${isValid ? 'status-valid' : 'status-used'}">
                            ${isValid ? 'Valid' : 'Used'}
                        </div>
                    </div>
                    <div class="ticket-details">
                        <div class="detail-row">
                            <span class="detail-label">Name</span>
                            <span class="detail-value">${qrData.name}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Email</span>
                            <span class="detail-value">${qrData.email}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Event</span>
                            <span class="detail-value">${qrData.eventTitle}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Ticket Type</span>
                            <span class="detail-value">${qrData.ticketType.charAt(0).toUpperCase() + qrData.ticketType.slice(1)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Quantity</span>
                            <span class="detail-value">${qrData.quantity}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Booked On</span>
                            <span class="detail-value">${new Date(qrData.timestamp).toLocaleDateString()}</span>
                        </div>
                    </div>
                </div>
                
                <div class="action-buttons">
                    ${isValid ? `
                        <button class="btn btn-success" onclick="allowEntry('${qrData.bookingId}')">
                            ✓ Allow Entry
                        </button>
                    ` : `
                        <button class="btn btn-primary" disabled>
                            ✗ Already Used
                        </button>
                    `}
                    <button class="btn btn-primary" onclick="resetScanner()">
                        Scan Next
                    </button>
                </div>
            `;
        }

        function allowEntry(bookingId) {
            fetch(TLDS_CONFIG.ENDPOINTS.markBookingUsed, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ bookingId: bookingId })
            })
            .then(res => res.json())
            .then(r => {
                if (r.status === "success") {
                    // Show success message
                    const successMsg = document.createElement('div');
                    successMsg.className = 'success-message';
                    successMsg.textContent = '✅ Entry allowed successfully';
                    result.insertBefore(successMsg, result.firstChild);
                    
                    // Update button state
                    const btn = document.querySelector('.btn-success');
                    if (btn) {
                        btn.textContent = '✗ Already Used';
                        btn.disabled = true;
                        btn.className = 'btn btn-primary';
                    }
                    
                    // Update status
                    const status = document.querySelector('.ticket-status');
                    if (status) {
                        status.textContent = 'Used';
                        status.className = 'ticket-status status-used';
                    }
                    
                    setTimeout(() => {
                        successMsg.remove();
                    }, 3000);
                } else {
                    showError("❌ Already used or invalid");
                }
            })
            .catch(err => {
                console.error("Mark used error:", err);
                showError("❌ Error updating status");
            });
        }

        function resetScanner() {
            scanning = true;
            result.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📷</div>
                    <p>Scan a QR code to view ticket details</p>
                </div>
            `;
        }
    </script>

    <script src="config.js"></script>
<script src="content-protection.js"></script>
    <script src="navbar.js"></script>
    <script src="footer.js"></script>
    <script src="animations.js"></script>

</body>
</html>
