<!DOCTYPE html>
<html>
<head>
<title>Admin Panel - TLDS Events | Thinklab Digital Solutions LLP</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="animations.css">

<style>
:root{
  --bg:#131414;
  --card:#1C1C1E;
  --accent:#A280FF;
  --text:#fff;
  --muted:#aaa;
  --gradient:linear-gradient(135deg, #A280FF 0%, #7B68EE 100%);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  font-family:'Poppins',sans-serif;
  background:var(--bg);
  color:white;
  min-height:100vh;
  padding-bottom:50px;
}

/* NAVBAR */

.navbar{
  width:100%;
  background:rgba(19,20,20,0.95);
  backdrop-filter:blur(10px);
  padding:15px 30px;
  position:sticky;
  top:0;
  z-index:1000;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.nav-container{
  max-width:1400px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo img{
  height:50px;
}

.nav-links{
  display:flex;
  gap:30px;
}

.nav-links a{
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  font-weight:500;
  transition:0.3s;
  position:relative;
}

.nav-links a:hover{
  color:var(--accent);
}

.nav-links a::after{
  content:'';
  position:absolute;
  bottom:-5px;
  left:0;
  width:0;
  height:2px;
  background:var(--accent);
  transition:0.3s;
}

.nav-links a:hover::after{
  width:100%;
}

@media(max-width:768px){
  .nav-links{
    display:none;
  }
}

/* Toggle Switch Styles */
.switch {
  position: relative;
  display: inline-block;
  width: 50px;
  height: 24px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: .4s;
  border-radius: 24px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 18px;
  width: 18px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: var(--accent);
}

input:checked + .slider:before {
  transform: translateX(26px);
}

/* LOGIN SECTION */

h2{
  text-align:center;
  margin-top:50px;
  color:var(--accent);
  font-size:28px;
}

#loginBox{
  max-width:400px;
  margin:30px auto;
  background:var(--card);
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

/* PANEL */

#panel{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

/* INPUTS */

input, select, textarea{
  width:100%;
  padding:12px 16px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #333;
  background:#1a1a1a;
  color:white;
  font-family:'League Spartan',sans-serif;
  font-size:14px;
  transition:border-color 0.3s;
}

input:focus, select:focus, textarea:focus{
  outline:none;
  border-color:var(--accent);
}

/* BUTTONS */

button{
  padding:12px 24px;
  cursor:pointer;
  border:none;
  border-radius:8px;
  font-family:'League Spartan',sans-serif;
  font-weight:600;
  font-size:14px;
  transition:all 0.3s;
}

.tab-btn{
  background:#222;
  color:white;
}

.tab-btn:hover{
  background:#333;
}

.tab-btn.active{
  background:var(--accent);
  box-shadow:0 4px 15px rgba(162,128,255,0.3);
}

/* TABS */

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:30px;
  background:var(--card);
  padding:10px;
  border-radius:12px;
  max-width:fit-content;
}

.tab-content{
  display:none;
}

.tab-content.active{
  display:block;
}

/* CARDS */

.card{
  background:var(--card);
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
  margin-bottom:30px;
}

/* STATS */

h3{
  color:var(--accent);
  margin-bottom:20px;
  font-size:24px;
}

.stats-container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.stat-card{
  background:linear-gradient(135deg, #252525 0%, #1a1a1a 100%);
  padding:25px;
  border-radius:12px;
  border:1px solid #333;
  text-align:center;
}

.stat-value{
  font-size:32px;
  font-weight:600;
  color:var(--accent);
  margin:10px 0;
}

.stat-label{
  color:var(--muted);
  font-size:14px;
}

/* TABLE */

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  background:var(--card);
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

th,td{
  padding:16px;
  text-align:left;
  border-bottom:1px solid #333;
}

th{
  background:linear-gradient(135deg, #252525 0%, #1a1a1a 100%);
  color:var(--accent);
  font-weight:600;
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}

td{
  color:#ddd;
}

tr:hover td{
  background:rgba(162,128,255,0.05);
}

/* DELETE BUTTONS */

table button{
  padding:8px 16px;
  background:#ff6b6b;
  color:white;
  font-size:12px;
}

table button:hover{
  background:#ff5252;
  transform:scale(1.05);
}

/* SCANNER STYLES */

.scanner-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2rem;
  margin-top: 20px;
}

@media (max-width: 768px) {
  .scanner-container {
    grid-template-columns: 1fr;
  }
}

.scanner-card {
  background: var(--card);
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.scanner-title {
  color: var(--accent);
  margin-bottom: 20px;
  font-size: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.scanner-title::before {
  content: "📱";
}

#adminReader {
  width: 100%;
  max-width: 400px;
  margin: 0 auto;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
}

.scan-result {
  background: var(--card);
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}

.ticket-display-admin {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 15px;
  position: relative;
  overflow: hidden;
}

.ticket-display-admin::before {
  content: "";
  position: absolute;
  top: -50%;
  right: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  animation: shimmer 3s infinite;
}

@keyframes shimmer {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.ticket-header-admin {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  position: relative;
  z-index: 1;
}

.booking-id-admin {
  font-size: 18px;
  font-weight: 700;
  color: #fff;
}

.ticket-status-admin {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
}

.status-valid-admin {
  background: #46d369;
  color: #fff;
}

.status-used-admin {
  background: #e87c03;
  color: #fff;
}

.ticket-details-admin {
  display: grid;
  gap: 10px;
  position: relative;
  z-index: 1;
}

.detail-row-admin {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.detail-label-admin {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.8);
}

.detail-value-admin {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
}

.action-buttons-admin {
  display: flex;
  gap: 10px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.btn-admin {
  flex: 1;
  padding: 10px 15px;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 14px;
  text-transform: uppercase;
}

.btn-success-admin {
  background: #46d369;
  color: white;
}

.btn-success-admin:hover:not(:disabled) {
  background: #3ab54a;
}

.btn-primary-admin {
  background: var(--accent);
  color: white;
}

.btn-primary-admin:hover:not(:disabled) {
  background: #7B68EE;
}

.btn-admin:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.error-message-admin {
  background: rgba(229, 9, 20, 0.1);
  border: 1px solid #e50914;
  color: #e50914;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  margin: 10px 0;
}

.success-message-admin {
  background: rgba(70, 211, 105, 0.1);
  border: 1px solid #46d369;
  color: #46d369;
  padding: 15px;
  border-radius: 8px;
  text-align: center;
  margin: 10px 0;
}

.loading-admin {
  text-align: center;
  padding: 20px;
  color: var(--muted);
}

.empty-state-admin {
  text-align: center;
  padding: 40px;
  color: var(--muted);
}

/* FOOTER */

footer{
  background:#0d0d0d;
  padding:50px 30px 30px;
  margin-top:100px;
  border-top:1px solid rgba(255,255,255,0.1);
}

.footer-content{
  max-width:1400px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:40px;
}

.footer-section h4{
  color:var(--accent);
  margin-bottom:20px;
  font-size:18px;
}

.footer-section p{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

.footer-section a{
  display:block;
  color:var(--muted);
  text-decoration:none;
  margin-bottom:10px;
  font-size:14px;
  transition:0.3s;
}

.footer-section a:hover{
  color:var(--accent);
}

.footer-bottom{
  max-width:1400px;
  margin:auto;
  margin-top:50px;
  padding-top:30px;
  border-top:1px solid rgba(255,255,255,0.1);
  text-align:center;
  color:var(--muted);
  font-size:13px;
}
</style>

</head>

<body>

<h2>Admin Login</h2>

<div id="loginBox">
  <input id="user" placeholder="Username"><br>
  <input id="pass" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none"></div>

<script src="config.js"></script>
<script src="content-protection.js"></script>
<script>

// Using centralized config from config.js
// BASE_URL is automatically set based on environment

let isLoggedIn = false;
let selectedEventId = "";

/* ================= LOGIN ================= */

function login(){

fetch(TLDS_CONFIG.ENDPOINTS.admin.login,{
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify({
  username: document.getElementById("user").value,
  password: document.getElementById("pass").value
})
})
.then(res => res.json())
.then(data => {

if(data.success){
  localStorage.setItem("adminToken", data.token);
  isLoggedIn = true;

  document.getElementById("loginBox").style.display = "none";

  loadDashboard();
}else{
  alert("Wrong credentials");
}

});

}

/* ================= DASHBOARD ================= */

function loadDashboard(){

if(!isLoggedIn){
  return;
}

const panel = document.getElementById("panel");
panel.style.display = "block";

const token = localStorage.getItem("adminToken");
let url = TLDS_CONFIG.ENDPOINTS.admin.data;
if(selectedEventId){
  url += "?eventId=" + selectedEventId;
}

fetch(url,{
headers:{
  "Authorization": "Bearer " + token
}
})
.then(res => {

if(res.status === 403){
  alert("Session expired. Login again.");
  localStorage.removeItem("adminToken");
  isLoggedIn = false;
  location.reload();
  return;
}

return res.json();

})
.then(data => {

if(!data) return;

const stats = data.stats || {};
const bookings = data.bookings || [];
const events = data.events || [];

let html = `
<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('bookings')">Bookings</button>
  <button class="tab-btn" onclick="switchTab('events')">Events</button>
  <button class="tab-btn" onclick="switchTab('scanner')">Scanner</button>
</div>

<div id="bookingsTab" class="tab-content active">
<div style="margin-bottom:20px;">
  <label>Filter by Event: </label>
  <select id="eventFilter" onchange="changeEventFilter()">
    <option value="">All Events</option>
    ${events.map(e => `<option value="${e._id}" ${selectedEventId === e._id ? 'selected' : ''}>${e.title}</option>`).join('')}
  </select>
</div>

<div class="stats-container">
  <div class="stat-card">
    <div class="stat-label">Total Revenue</div>
    <div class="stat-value">₹${(stats.totalRevenue || 0).toLocaleString()}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Single Tickets Sold</div>
    <div class="stat-value">${stats.singleSold || 0}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Couple Tickets Sold</div>
    <div class="stat-value">${stats.coupleSold || 0}</div>
  </div>
</div>
`;

if(selectedEventId){
  const event = events.find(e => e._id === selectedEventId);
  if(event){
    html += `
<div class="stats-container">
  <div class="stat-card">
    <div class="stat-label">Single Remaining</div>
    <div class="stat-value">${event.singleLimit - (stats.singleSold || 0)}</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Couple Remaining</div>
    <div class="stat-value">${event.coupleLimit - (stats.coupleSold || 0)}</div>
  </div>
</div>
`;
  }
}

html += `
<table>
<tr>
<th>Name</th>
<th>Event</th>
<th>Type</th>
<th>Total Tickets</th>
<th>Booking ID</th>
<th>Status</th>
<th>Actions</th>
</tr>
`;

bookings.forEach(b=>{
html += `
<tr>
<td>${b.name}</td>
<td>${b.eventTitle || 'N/A'}</td>
<td>${b.ticketType}</td>
<td>${b.totalTickets}</td>
<td>${b.bookingId}</td>
<td>${b.used ? '<span style="color: #e87c03;">Used</span>' : '<span style="color: #46d369;">Valid</span>'}</td>
<td>
  ${b.used ? `<button onclick="markUnused('${b.bookingId}')" style="background:#f9ab00; margin-right:5px;">Mark Unused</button>` : ''}
  <button onclick="del('${b.bookingId}')">Delete</button>
</td>
</tr>
`;
});

html += "</table></div>";

html += `
<div id="eventsTab" class="tab-content">
<div style="margin-bottom:30px; background:var(--card); padding:25px; border-radius:12px;">
  <h3 style="color:var(--accent); margin-bottom:20px;" id="formTitle">Add New Event</h3>
  <input type="hidden" id="editEventId" value="">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
    <input type="text" id="eventTitle" placeholder="Event Title">
    <input type="text" id="eventDate" placeholder="Date (e.g., June 15, 2026)">
    <input type="text" id="eventTime" placeholder="Time (e.g., 7:00 PM)">
    <input type="text" id="eventVenue" placeholder="Venue">
    <input type="number" id="eventSinglePrice" placeholder="Single Price">
    <input type="number" id="eventCouplePrice" placeholder="Couple Price">
    <input type="number" id="eventSingleLimit" placeholder="Single Limit">
    <input type="number" id="eventCoupleLimit" placeholder="Couple Limit">
  </div>
  <input type="text" id="eventImage" placeholder="Image URL" style="margin-top:15px;">
  <textarea id="eventDescription" placeholder="Short Description" style="margin-top:15px; min-height:60px;"></textarea>
  <textarea id="eventLongDescription" placeholder="Long Description" style="margin-top:15px; min-height:100px;"></textarea>
  <button onclick="saveEvent()" style="margin-top:15px; background:var(--accent);" id="saveEventBtn">Create Event</button>
  <button onclick="cancelEdit()" style="margin-top:15px; background:#666; display:none;" id="cancelEditBtn">Cancel</button>
  <div id="eventStatus" style="margin-top:10px; text-align:center;"></div>
</div>

<h3>All Events</h3>
<table>
<tr>
<th>Title</th>
<th>Date</th>
<th>Time</th>
<th>Venue</th>
<th>Single Price</th>
<th>Couple Price</th>
<th>Single Limit</th>
<th>Couple Limit</th>
<th>Status</th>
<th>Actions</th>
</tr>
`;

events.forEach(e=>{
html += `
<tr>
<td>${e.title}</td>
<td>${e.date}</td>
<td>${e.time}</td>
<td>${e.venue}</td>
<td>₹${e.singlePrice}</td>
<td>₹${e.couplePrice}</td>
<td>${e.singleLimit}</td>
<td>${e.coupleLimit}</td>
<td>
  <label class="switch">
    <input type="checkbox" ${e.isActive ? 'checked' : ''} onchange="toggleEventStatus('${e._id}', this.checked)">
    <span class="slider"></span>
  </label>
  <span style="margin-left:10px; font-size:12px;">${e.isActive ? 'Active' : 'Inactive'}</span>
</td>
<td>
  <button onclick="editEvent('${e._id}')" style="background:#4ade80; margin-right:5px;">Edit</button>
  <button onclick="deleteEvent('${e._id}')">Delete</button>
</td>
</tr>
`;
});

html += "</table></div>";

html += `
<div id="scannerTab" class="tab-content">
  <div class="scanner-container">
    <div class="scanner-card">
      <h3 class="scanner-title">Scan QR Code</h3>
      <div id="adminReader"></div>
      <div id="scanErrorAdmin" class="error-message-admin" style="display: none;"></div>
    </div>
    
    <div class="scanner-card">
      <h3 class="scanner-title">Ticket Details</h3>
      <div id="scanResultAdmin">
        <div class="empty-state-admin">
          <p>📷 Scan a QR code to view ticket details</p>
        </div>
      </div>
    </div>
  </div>
</div>
`;

panel.innerHTML = html;

// Initialize scanner if scanner tab is active
if(document.getElementById('scannerTab') && document.getElementById('scannerTab').classList.contains('active')) {
  initAdminScanner();
}

})
.catch(err=>{
console.error(err);
panel.innerHTML = "Error loading data";
});

}

function changeEventFilter(){
  selectedEventId = document.getElementById("eventFilter").value;
  loadDashboard();
}

function switchTab(tabName){
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
  
  event.target.classList.add('active');
  document.getElementById(tabName + 'Tab').classList.add('active');
  
  // Initialize scanner when switching to scanner tab
  if(tabName === 'scanner') {
    setTimeout(() => initAdminScanner(), 100);
  }
}

function deleteEvent(eventId){
  if(!confirm("Delete this event? This will also delete all associated bookings.")) return;
  
  const token = localStorage.getItem("adminToken");
  
  fetch(TLDS_CONFIG.ENDPOINTS.admin.deleteEvent(eventId),{
    method:"DELETE",
    headers:{
      "Authorization":"Bearer " + token
    }
  })
  .then(res => {
    if(res.status === 403){
      alert("Unauthorized");
      return;
    }
    loadDashboard();
  })
  .catch(err => {
    alert("Error deleting event");
  });
}

function toggleEventStatus(eventId, isActive){
  const token = localStorage.getItem("adminToken");
  
  fetch(TLDS_CONFIG.ENDPOINTS.admin.updateEventStatus(eventId),{
    method:"PUT",
    headers:{
      "Authorization":"Bearer " + token,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({isActive})
  })
  .then(res => {
    if(res.status === 403){
      alert("Unauthorized");
      return;
    }
    return res.json();
  })
  .then(data => {
    if(data.success){
      loadDashboard(); // Refresh the dashboard to show updated status
    } else {
      alert("Error updating event status");
    }
  })
  .catch(err => {
    alert("Error updating event status");
  });
}

function editEvent(eventId){
  const token = localStorage.getItem("adminToken");
  
  fetch(TLDS_CONFIG.ENDPOINTS.event(eventId),{
    headers:{
      "Authorization":"Bearer " + token
    }
  })
  .then(res => res.json())
  .then(event => {
    if(event){
      // Populate form with event data
      document.getElementById("editEventId").value = event._id;
      document.getElementById("eventTitle").value = event.title;
      document.getElementById("eventDate").value = event.date;
      document.getElementById("eventTime").value = event.time;
      document.getElementById("eventVenue").value = event.venue;
      document.getElementById("eventSinglePrice").value = event.singlePrice;
      document.getElementById("eventCouplePrice").value = event.couplePrice;
      document.getElementById("eventSingleLimit").value = event.singleLimit;
      document.getElementById("eventCoupleLimit").value = event.coupleLimit;
      document.getElementById("eventImage").value = event.image || "";
      document.getElementById("eventDescription").value = event.description || "";
      document.getElementById("eventLongDescription").value = event.longDescription || "";
      
      // Update UI for edit mode
      document.getElementById("formTitle").textContent = "Edit Event";
      document.getElementById("saveEventBtn").textContent = "Update Event";
      document.getElementById("cancelEditBtn").style.display = "inline-block";
      
      // Scroll to form
      document.getElementById("eventsTab").scrollIntoView({behavior:"smooth"});
    }
  })
  .catch(err => {
    alert("Error loading event data");
  });
}

function cancelEdit(){
  // Reset form
  document.getElementById("editEventId").value = "";
  document.getElementById("eventTitle").value = "";
  document.getElementById("eventDate").value = "";
  document.getElementById("eventTime").value = "";
  document.getElementById("eventVenue").value = "";
  document.getElementById("eventSinglePrice").value = "";
  document.getElementById("eventCouplePrice").value = "";
  document.getElementById("eventSingleLimit").value = "";
  document.getElementById("eventCoupleLimit").value = "";
  document.getElementById("eventImage").value = "";
  document.getElementById("eventDescription").value = "";
  document.getElementById("eventLongDescription").value = "";
  
  // Reset UI to create mode
  document.getElementById("formTitle").textContent = "Add New Event";
  document.getElementById("saveEventBtn").textContent = "Create Event";
  document.getElementById("cancelEditBtn").style.display = "none";
  document.getElementById("eventStatus").textContent = "";
}

function saveEvent(){
  const token = localStorage.getItem("adminToken");
  const status = document.getElementById("eventStatus");
  const editEventId = document.getElementById("editEventId").value;
  
  const eventData = {
    title: document.getElementById("eventTitle").value,
    date: document.getElementById("eventDate").value,
    time: document.getElementById("eventTime").value,
    venue: document.getElementById("eventVenue").value,
    singlePrice: parseInt(document.getElementById("eventSinglePrice").value),
    couplePrice: parseInt(document.getElementById("eventCouplePrice").value),
    singleLimit: parseInt(document.getElementById("eventSingleLimit").value),
    coupleLimit: parseInt(document.getElementById("eventCoupleLimit").value),
    image: document.getElementById("eventImage").value,
    description: document.getElementById("eventDescription").value,
    longDescription: document.getElementById("eventLongDescription").value,
    isActive: true
  };
  
  if(!eventData.title || !eventData.date || !eventData.time || !eventData.venue || !eventData.singlePrice || !eventData.couplePrice){
    status.style.color = "#ff6b6b";
    status.textContent = "Please fill all required fields";
    return;
  }
  
  status.style.color = "#4ade80";
  status.textContent = editEventId ? "Updating event..." : "Creating event...";
  
  const url = editEventId ? TLDS_CONFIG.ENDPOINTS.admin.updateEvent(editEventId) : TLDS_CONFIG.ENDPOINTS.admin.createEvent;
  const method = editEventId ? "PUT" : "POST";
  
  fetch(url,{
    method:method,
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer " + token
    },
    body: JSON.stringify(eventData)
  })
  .then(res => {
    if(res.status === 403){
      status.style.color = "#ff6b6b";
      status.textContent = "Unauthorized";
      return;
    }
    return res.json();
  })
  .then(data => {
    if(data && data.success){
      status.style.color = "#4ade80";
      status.textContent = editEventId ? "Event updated successfully!" : "Event created successfully!";
      
      cancelEdit();
      loadDashboard();
    }else{
      status.style.color = "#ff6b6b";
      status.textContent = editEventId ? "Failed to update event" : "Failed to create event";
    }
  })
  .catch(err => {
    status.style.color = "#ff6b6b";
    status.textContent = editEventId ? "Error updating event" : "Error creating event";
  });
}

/* ================= ADMIN SCANNER ================= */

let adminScanner = null;
let adminScanning = true;

function initAdminScanner() {
  const resultDiv = document.getElementById('scanResultAdmin');
  const errorDiv = document.getElementById('scanErrorAdmin');
  
  if(!resultDiv || !document.getElementById('adminReader')) {
    return;
  }

  // Reset result
  resultDiv.innerHTML = `
    <div class="empty-state-admin">
      <p>📷 Scan a QR code to view ticket details</p>
    </div>
  `;

  // Stop existing scanner if any
  if(adminScanner) {
    adminScanner.stop().catch(() => {});
  }

  // Load HTML5-QRCode library if not loaded
  if(typeof Html5Qrcode === 'undefined') {
    const script = document.createElement('script');
    script.src = 'https://unpkg.com/html5-qrcode';
    script.onload = () => startAdminScanner();
    document.head.appendChild(script);
  } else {
    startAdminScanner();
  }
}

function startAdminScanner() {
  const resultDiv = document.getElementById('scanResultAdmin');
  const errorDiv = document.getElementById('scanErrorAdmin');
  
  adminScanner = new Html5Qrcode("adminReader");
  adminScanning = true;

  Html5Qrcode.getCameras()
    .then(devices => {
      if (devices && devices.length) {
        adminScanner.start(
          { facingMode: "environment" },
          { 
            fps: 10, 
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
          },
          (decodedText) => {
            handleAdminScan(decodedText);
          },
          (error) => {
            // Silent scan errors
          }
        );
      } else {
        showAdminError("No camera found");
      }
    })
    .catch(err => {
      console.error("Camera error:", err);
      showAdminError("Camera access failed");
    });
}

function showAdminError(message) {
  const errorDiv = document.getElementById('scanErrorAdmin');
  if(errorDiv) {
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
    setTimeout(() => {
      errorDiv.style.display = 'none';
    }, 3000);
  }
}

function handleAdminScan(decodedText) {
  if (!adminScanning) return;
  adminScanning = false;

  const resultDiv = document.getElementById('scanResultAdmin');
  
  let data;
  try {
    data = JSON.parse(decodedText);
  } catch {
    resultDiv.innerHTML = '<div class="error-message-admin">❌ Invalid QR Code</div>';
    setTimeout(() => { adminScanning = true; }, 2000);
    return;
  }

  console.log("QR Data:", data);

  // Display loading state
  resultDiv.innerHTML = '<div class="loading-admin">Validating ticket...</div>';

  // Validate ticket
  fetch(TLDS_CONFIG.ENDPOINTS.checkBooking, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ bookingId: data.bookingId })
  })
  .then(res => res.json())
  .then(res => {
    console.log("Backend response:", res);

    if (res.status !== "ok") {
      resultDiv.innerHTML = '<div class="error-message-admin">❌ Invalid Booking</div>';
      setTimeout(() => { adminScanning = true; }, 2000);
      return;
    }

    // Display ticket details
    displayAdminTicket(data, res);
  })
  .catch(err => {
    console.error("Fetch error:", err);
    resultDiv.innerHTML = '<div class="error-message-admin">❌ Server Error</div>';
    setTimeout(() => { adminScanning = true; }, 2000);
  });
}

function displayAdminTicket(qrData, bookingData) {
  const resultDiv = document.getElementById('scanResultAdmin');
  const isValid = !bookingData.used;
  
  resultDiv.innerHTML = `
    <div class="ticket-display-admin">
      <div class="ticket-header-admin">
        <div class="booking-id-admin">${qrData.bookingId}</div>
        <div class="ticket-status-admin ${isValid ? 'status-valid-admin' : 'status-used-admin'}">
          ${isValid ? 'Valid' : 'Used'}
        </div>
      </div>
      <div class="ticket-details-admin">
        <div class="detail-row-admin">
          <span class="detail-label-admin">Name</span>
          <span class="detail-value-admin">${qrData.name}</span>
        </div>
        <div class="detail-row-admin">
          <span class="detail-label-admin">Email</span>
          <span class="detail-value-admin">${qrData.email}</span>
        </div>
        <div class="detail-row-admin">
          <span class="detail-label-admin">Event</span>
          <span class="detail-value-admin">${qrData.eventTitle}</span>
        </div>
        <div class="detail-row-admin">
          <span class="detail-label-admin">Ticket Type</span>
          <span class="detail-value-admin">${qrData.ticketType.charAt(0).toUpperCase() + qrData.ticketType.slice(1)}</span>
        </div>
        <div class="detail-row-admin">
          <span class="detail-label-admin">Quantity</span>
          <span class="detail-value-admin">${qrData.quantity}</span>
        </div>
        <div class="detail-row-admin">
          <span class="detail-label-admin">Booked On</span>
          <span class="detail-value-admin">${new Date(qrData.timestamp).toLocaleDateString()}</span>
        </div>
      </div>
    </div>
    
    <div class="action-buttons-admin">
      ${isValid ? `
        <button class="btn-admin btn-success-admin" onclick="allowAdminEntry('${qrData.bookingId}')">
          ✓ Allow Entry
        </button>
        <button class="btn-admin btn-primary-admin" onclick="markAdminUnused('${qrData.bookingId}')" style="background: #f9ab00;">
          ↺ Mark Unused
        </button>
      ` : `
        <button class="btn-admin btn-primary-admin" disabled>
          ✗ Already Used
        </button>
        <button class="btn-admin btn-primary-admin" onclick="markAdminUnused('${qrData.bookingId}')" style="background: #f9ab00;">
          ↺ Mark Unused
        </button>
      `}
      <button class="btn-admin btn-primary-admin" onclick="resetAdminScanner()">
        Scan Next
      </button>
    </div>
  `;
}

function allowAdminEntry(bookingId) {
  const token = localStorage.getItem("adminToken");
  
  fetch(TLDS_CONFIG.ENDPOINTS.markBookingUsed, {
    method: "POST",
    headers: { 
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ bookingId: bookingId })
  })
  .then(res => res.json())
  .then(r => {
    if (r.status === "ok") {
      // Show success message
      const resultDiv = document.getElementById('scanResultAdmin');
      const successMsg = document.createElement('div');
      successMsg.className = 'success-message-admin';
      successMsg.textContent = '✅ Entry allowed successfully';
      resultDiv.insertBefore(successMsg, resultDiv.firstChild);
      
      // Update button state
      const btn = document.querySelector('.btn-success-admin');
      if (btn) {
        btn.textContent = '✗ Already Used';
        btn.disabled = true;
        btn.className = 'btn-admin btn-primary-admin';
      }
      
      // Update status
      const status = document.querySelector('.ticket-status-admin');
      if (status) {
        status.textContent = 'Used';
        status.className = 'ticket-status-admin status-used-admin';
      }
      
      setTimeout(() => {
        successMsg.remove();
      }, 3000);
    } else {
      showAdminError("❌ Already used or invalid");
    }
  })
  .catch(err => {
    console.error("Mark used error:", err);
    showAdminError("❌ Error updating status");
  });
}

function markAdminUnused(bookingId) {
  const token = localStorage.getItem("adminToken");
  
  fetch(TLDS_CONFIG.ENDPOINTS.markBookingUnused, {
    method: "POST",
    headers: { 
      "Content-Type": "application/json",
      "Authorization": "Bearer " + token
    },
    body: JSON.stringify({ bookingId: bookingId })
  })
  .then(res => res.json())
  .then(r => {
    if (r.status === "ok") {
      // Show success message
      const resultDiv = document.getElementById('scanResultAdmin');
      const successMsg = document.createElement('div');
      successMsg.className = 'success-message-admin';
      successMsg.textContent = '✅ Ticket marked as unused';
      resultDiv.insertBefore(successMsg, resultDiv.firstChild);
      
      // Update button states
      const usedBtn = document.querySelector('.btn-admin[disabled]');
      if (usedBtn) {
        usedBtn.disabled = false;
        usedBtn.textContent = '✓ Allow Entry';
        usedBtn.className = 'btn-admin btn-success-admin';
      }
      
      // Update status
      const status = document.querySelector('.ticket-status-admin');
      if (status) {
        status.textContent = 'Valid';
        status.className = 'ticket-status-admin status-valid-admin';
      }
      
      setTimeout(() => {
        successMsg.remove();
      }, 3000);
    } else {
      showAdminError("❌ Failed to update status");
    }
  })
  .catch(err => {
    console.error("Mark unused error:", err);
    showAdminError("❌ Error updating status");
  });
}

function resetAdminScanner() {
  adminScanning = true;
  const resultDiv = document.getElementById('scanResultAdmin');
  if(resultDiv) {
    resultDiv.innerHTML = `
      <div class="empty-state-admin">
        <p>📷 Scan a QR code to view ticket details</p>
      </div>
    `;
  }
}
