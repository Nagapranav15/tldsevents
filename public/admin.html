<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body{
  font-family: Arial;
  background:#131414;
  color:white;
  text-align:center;
}

input{
  padding:10px;
  margin:5px;
}

button{
  padding:10px 15px;
  cursor:pointer;
}

table{
  margin:auto;
  margin-top:20px;
  border-collapse:collapse;
  width:90%;
}

th,td{
  padding:10px;
  border:1px solid #444;
}

th{
  background:#222;
}
</style>

</head>

<body>

<h2>Admin Login</h2>

<div id="loginBox">
  <input id="user" placeholder="Username"><br>
  <input id="pass" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none"></div>

<script>

/* 🔥 CHANGE THIS AFTER DEPLOY */
const BASE_URL = "https://tldsevents.onrender.com";
// const BASE_URL = "https://your-backend.onrender.com";

let isLoggedIn = false;

/* ================= LOGIN ================= */

function login(){

fetch(BASE_URL + "/admin-login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body: JSON.stringify({
  username: document.getElementById("user").value,
  password: document.getElementById("pass").value
})
})
.then(res => res.json())
.then(data => {

if(data.success){
  localStorage.setItem("adminToken", data.token);
  isLoggedIn = true;

  document.getElementById("loginBox").style.display = "none";

  loadDashboard();
}else{
  alert("Wrong credentials");
}

});

}

/* ================= DASHBOARD ================= */

function loadDashboard(){

if(!isLoggedIn){
  return;
}

const panel = document.getElementById("panel");
panel.style.display = "block";

const token = localStorage.getItem("adminToken");

fetch(BASE_URL + "/admin-data",{
headers:{
  "Authorization": "Bearer " + token
}
})
.then(res => {

if(res.status === 403){
  alert("Session expired. Login again.");
  localStorage.removeItem("adminToken");
  isLoggedIn = false;
  location.reload();
  return;
}

return res.json();

})
.then(data => {

if(!data) return;

const stats = data.stats || {};
const bookings = data.bookings || [];

let html = `
<h3>Stats</h3>
Revenue: ₹${stats.totalRevenue || 0}<br>
Single Tickets: ${stats.singleSold || 0}<br>
Couple Tickets: ${stats.coupleSold || 0}<br><br>

<b>Remaining Tickets:</b><br>
Single Left: ${100 - (stats.singleSold || 0)}<br>
Couple Left: ${25 - (stats.coupleSold || 0)}<br><br>
`;

html += `
<table>
<tr>
<th>Name</th>
<th>Type</th>
<th>Total Tickets</th>
<th>Booking ID</th>
<th>Delete</th>
</tr>
`;

bookings.forEach(b=>{
html += `
<tr>
<td>${b.name}</td>
<td>${b.ticketType}</td>
<td>${b.totalTickets}</td>
<td>${b.bookingId}</td>
<td><button onclick="del('${b.bookingId}')">Delete</button></td>
</tr>
`;
});

html += "</table>";

panel.innerHTML = html;

})
.catch(err=>{
console.error(err);
panel.innerHTML = "Error loading data";
});

}

/* ================= DELETE ================= */

function del(id){

if(!confirm("Delete this booking?")) return;

const token = localStorage.getItem("adminToken");

fetch(BASE_URL + "/delete-booking",{
method:"DELETE",
headers:{
  "Content-Type":"application/json",
  "Authorization":"Bearer " + token
},
body: JSON.stringify({bookingId:id})
})
.then(res => {
  if(res.status === 403){
    alert("Unauthorized");
    return;
  }
  loadDashboard();
});

}

/* ================= AUTO REFRESH ================= */

setInterval(() => {
  if(isLoggedIn){
    loadDashboard();
  }
}, 5000);

</script>

</body>
</html>
